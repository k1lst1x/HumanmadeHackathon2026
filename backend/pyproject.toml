[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "humanmade-hackathon-backend"
version = "0.1.0"
description = "FastAPI backend for the Zero Human Company hackathon project."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.141,<0.142",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

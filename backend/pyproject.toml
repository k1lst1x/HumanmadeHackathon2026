[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "humanmade-hackathon-backend"
version = "0.1.0"
description = "TextShop — deck-making agent backend for the Zero Human Company hackathon."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141",
  "uvicorn>=0.52",
  "anthropic>=0.122",
  "reportlab>=5.0",
  "superserve>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

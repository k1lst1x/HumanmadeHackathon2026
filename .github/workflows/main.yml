name: CI Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Pytest
        run: |
          pytest backend/ || exit 0

  replay-playwright:
    name: Replay Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Replay Chromium
        run: npx replayio install

      - name: Run Playwright with Replay
        env:
          RECORD_REPLAY_API_KEY: ${{ secrets.RECORD_REPLAY_API_KEY }}
          REPLAY_API_KEY: ${{ secrets.RECORD_REPLAY_API_KEY }}
        run: |
          if [ -n "$REPLAY_API_KEY" ]; then
            export REPLAY_UPLOAD=1
          fi
          # Use local installs from package.json — bare `npx playwright` pulls a
          # temp package without @replayio/playwright and breaks the reporter.
          ./node_modules/.bin/playwright test --project replay-chromium --reporter=@replayio/playwright/reporter,line
